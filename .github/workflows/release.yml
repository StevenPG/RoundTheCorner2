# Publishes signed sideload APKs to a GitHub Release whenever a version tag is
# pushed (or a release is created in the GitHub UI, which creates the tag):
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag sets the app version: versionName 0.2.0, versionCode 200.
# Signing uses the release key stored in repository secrets; run
# tools/setup_release_signing.sh once to create it.
name: Release

on:
  push:
    tags: ["v*.*.*"]

# Needed to create the release and upload the APKs.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true" # Turns Kotlin warnings into errors (see build-logic).
    steps:
      - uses: actions/checkout@v5

      - name: Work out the version from the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$tag' must look like v1.2.3"
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"

      # Refuse to publish APKs signed with a throwaway debug key: users couldn't
      # update from one release to the next.
      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RTC_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Release signing secrets are missing. Run tools/setup_release_signing.sh once."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RTC_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle dependencies/build cache and validates the wrapper jar.
      - uses: gradle/actions/setup-gradle@v5

      - name: Build signed release APKs (full flavor, one per CPU type)
        env:
          RTC_KEYSTORE_PASSWORD: ${{ secrets.RTC_KEYSTORE_PASSWORD }}
          RTC_KEY_ALIAS: ${{ secrets.RTC_KEY_ALIAS }}
          RTC_KEY_PASSWORD: ${{ secrets.RTC_KEY_PASSWORD }}
        run: ./gradlew assembleFullRelease -Prtc.versionName=${{ steps.version.outputs.name }}

      - name: Name the APKs after the version
        id: apks
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/full/release/*.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-full-(.+)-release\.apk$/\1/')
            cp "$apk" "dist/RoundTheCorner-${{ steps.version.outputs.name }}-${abi}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -l dist

      # Creates the release with generated notes, or adds the APKs to one that
      # was already created in the GitHub UI.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "RoundTheCorner $TAG" --generate-notes
          fi

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
